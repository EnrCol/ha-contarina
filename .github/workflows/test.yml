name: Tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install aiohttp
      - name: Syntax and JSON
        run: |
          python -m compileall -q custom_components tests
          python -m json.tool custom_components/contarina/manifest.json >/dev/null
          python -m json.tool custom_components/contarina/strings.json >/dev/null
      - name: Unit tests
        run: python -m unittest discover -s tests -v
