name: Tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependency
        run: python -m pip install aiohttp
      - name: Syntax and JSON
        run: |
          python -m compileall -q custom_components tests
          python -m json.tool custom_components/contarina/manifest.json >/dev/null
          python -m json.tool custom_components/contarina/translations/en.json >/dev/null
          python -m json.tool custom_components/contarina/translations/it.json >/dev/null
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Bookmarklet tests
        run: node --test tests/*.test.mjs
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Newest harness available on PyPI (pins its own HA release; 2026.11 harness not yet published).
      - name: Install Home Assistant test harness
        run: python -m pip install pytest-homeassistant-custom-component playwright
      - name: Config flow, reconnect views and Chrome end-to-end
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: python -m pytest -q tests_ha
