name: Publish vetted Contarina beta
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install aiohttp
      - name: Syntax and JSON
        run: |
          python -m compileall -q custom_components tests tests_ha
          python -m json.tool custom_components/contarina/manifest.json >/dev/null
          python -m json.tool custom_components/contarina/translations/en.json >/dev/null
          python -m json.tool custom_components/contarina/translations/it.json >/dev/null
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bookmarklet tests (copy token + reconnect)
        run: node --test tests/*.test.mjs

  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Newest harness on PyPI (pins its own HA release).
      - name: Install Home Assistant test harness
        run: python -m pip install pytest-homeassistant-custom-component playwright
      - name: Config flow, reconnect views and Chrome end-to-end
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: python -m pytest -q tests_ha

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  release:
    # Published only when every validation above succeeded.
    needs: [unit, homeassistant, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine version, tag and release notes from manifest
        id: version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/contarina/manifest.json"))["version"])')
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$'; then
            echo "::error::Unexpected manifest version '$VERSION'"; exit 1
          fi
          NOTES="RELEASE_NOTES_${VERSION}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::Missing or empty $NOTES for version $VERSION"; exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "notes=${NOTES}"
          } >> "$GITHUB_OUTPUT"
      - name: Publish immutable beta release (if absent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: skip"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Contarina SOL $TAG (beta)" \
            --notes-file "$NOTES" \
            --prerelease
